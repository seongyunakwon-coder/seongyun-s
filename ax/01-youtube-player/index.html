<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취향 자동재생</title>
<style>
  :root { --bg:#111; --panel:#1c1c1f; --text:#eee; --muted:#999; --accent:#7aa2ff; --chip:#2a2a30; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, "Malgun Gothic", sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:10px; overflow:hidden; }
  .player > div, .player iframe { position:absolute; inset:0; width:100%; height:100%; }
  .now { margin:12px 0 4px; font-size:15px; }
  .now small { color:var(--muted); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  button { background:var(--chip); color:var(--text); border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover { filter:brightness(1.25); }
  button.on { background:var(--accent); color:#000; }
  .people { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .people button { font-size:13px; }
  .people button .w { color:var(--muted); margin-left:4px; }
  .people button .rec { font-size:11px; background:#3a3320; color:#f0c64a; border-radius:5px; padding:1px 5px; margin-left:5px; }
  .people button.on .rec { background:#123; }
  .profile { background:var(--panel); border-radius:10px; padding:12px 14px; margin:8px 0; display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:6px 16px; font-size:14px; }
  .profile .full { grid-column:1 / -1; }
  .profile dt { color:var(--muted); font-size:12px; }
  .profile dd { margin:0; }
  .profile .na { color:var(--muted); }
  .profile .why { color:#f0c64a; }
  .people button.on .w { color:#123; }
  .hint { color:var(--muted); font-size:12px; margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player"><div id="yt"></div></div>
  <div class="now" id="now">불러오는 중…</div>
  <div class="profile" id="profile"></div>
  <div class="bar">
    <button id="sound">🔇 소리 켜기</button>
    <button id="next">⏭ 다음</button>
    <button id="like">👍 좋아요</button>
    <button id="dislike">👎 별로 (다음 영상)</button>
    <button id="reset">취향 초기화</button>
  </div>
  <div class="people" id="people"></div>
  <div class="hint">
    사람 버튼으로 켜고 끕니다. 👍/👎를 누를수록 그 사람이 더 자주/덜 나오고, 👎한 영상은 다시 안 나옵니다.<br>
    브라우저 정책상 처음엔 음소거로 자동재생돼요. "소리 켜기"를 한 번 누르면 이후 영상도 소리가 켜진 채로 이어집니다.
  </div>
</div>

const PROFILES = {
  karina:    { real:'유지민', role:'aespa 리더', nation:'한국', birth:'2000-04-11', desc:'SM엔터테인먼트 걸그룹 aespa의 리더', src:'위키백과 등' },
  anna:      { real:'다나카 안나 (田中杏奈)', role:'MEOVV 멤버', nation:'일본 (도야마현)', birth:'2005-11-17', desc:'THEBLACKLABEL 걸그룹 MEOVV의 보컬·비주얼', src:'kprofiles, generasia' },

  wonyoung:  { real:'장원영', role:'IVE 멤버', nation:'한국', birth:'2004-08-31', desc:'스타쉽엔터테인먼트 걸그룹 IVE 멤버', src:'generasia' },
  kazuha:    { real:'나카무라 카즈하 (中村一葉)', role:'LE SSERAFIM 멤버', nation:'일본', birth:'2003-08-09', desc:'발레리나 출신의 LE SSERAFIM 멤버', src:'kprofiles, MyDramaList' },
  lisa:      { real:null, role:'패션·라이프스타일 유튜버', nation:'프랑스 (채널 국가)', birth:null, desc:'파리 일상·패션 브이로그. 언니는 Karen Napoly', src:'유튜브 채널 소개' },

function ageOf(birth) {
  if (!birth) return null;
  const [y, m, d] = birth.split('-').map(Number), t = new Date();
  return t.getFullYear() - y - ((t.getMonth() + 1 < m || (t.getMonth() + 1 === m && t.getDate() < d)) ? 1 : 0);
}
for (const k in PEOPLE) PEOPLE[k].ids = PEOPLE[k].ids.split(/\s+/);

// ---- 저장된 취향 ----
const KEY = 'ytpref-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(pref)); } catch {} }
let pref = load();
pref.weight ??= {}; pref.off ??= {}; pref.banned ??= {}; pref.liked ??= {}; pref.recent ??= []; pref.sound ??= false;
const startWeight = k => PEOPLE[k].rec ? 0.6 : 1;
for (const k in PEOPLE) pref.weight[k] ??= startWeight(k);

// ---- 다음 영상 고르기: 사람 가중치 랜덤 → 그 사람 영상 중 최근에 안 본 것 ----
function pick() {
  const active = Object.keys(PEOPLE).filter(k => !pref.off[k]);
  const pool = active.length ? active : Object.keys(PEOPLE);
  let total = pool.reduce((s, k) => s + pref.weight[k], 0), r = Math.random() * total, who = pool[0];
  for (const k of pool) { r -= pref.weight[k]; if (r <= 0) { who = k; break; } }
  let cands = PEOPLE[who].ids.filter(id => !pref.banned[id] && !pref.recent.includes(id));
  if (!cands.length) cands = PEOPLE[who].ids.filter(id => !pref.banned[id]);
  if (!cands.length) cands = PEOPLE[who].ids;
  // 좋아요 누른 영상은 3배 확률
  const bag = cands.flatMap(id => pref.liked[id] ? [id, id, id] : [id]);
  return { who, id: bag[Math.floor(Math.random() * bag.length)] };
}

let player, cur;
function playNext() {
  cur = pick();
  pref.recent = [cur.id, ...pref.recent.filter(x => x !== cur.id)].slice(0, 40);
  save();
  player.loadVideoById(cur.id);
  applySound();
  renderNow();
}
function applySound() { if (!player) return; pref.sound ? player.unMute() : player.mute(); }

function renderNow() {
  const t = player?.getVideoData?.().title || '';
  document.getElementById('now').innerHTML = `<b>${PEOPLE[cur.who].name}</b> ${t ? '· ' + t.replace(/</g,'&lt;') : ''} <small>${pref.liked[cur.id] ? '👍' : ''}</small>`;
  renderProfile(cur.who);
}
function renderProfile(who) {
  const p = PROFILES[who], el = document.getElementById('profile');
  if (!p) { el.hidden = true; return; }
  el.hidden = false;
  const na = '<span class="na">공개 정보 없음</span>';
  const age = ageOf(p.birth);
  el.innerHTML = `
    ${PEOPLE[who].rec ? `<div class="full why">추천 · ${PEOPLE[who].why}</div>` : ''}
    <div><dt>본명</dt><dd>${p.real || na}</dd></div>
    <div><dt>활동</dt><dd>${p.role}</dd></div>
    <div><dt>국적</dt><dd>${p.nation || na}</dd></div>
    <div><dt>생년월일 · 나이</dt><dd>${p.birth ? `${p.birth} · 만 ${age}세` : na}</dd></div>
    <div class="full"><dd>${p.desc}</dd><dt>출처: ${p.src}</dt></div>`;
}
function renderPeople() {
  const el = document.getElementById('people'); el.innerHTML = '';
  for (const k in PEOPLE) {
    const b = document.createElement('button');
    b.className = pref.off[k] ? '' : 'on';
    b.innerHTML = `${PEOPLE[k].name}${PEOPLE[k].rec ? '<span class="rec">추천</span>' : ''}<span class="w">×${pref.weight[k].toFixed(1)}</span>`;
    if (PEOPLE[k].rec) b.title = PEOPLE[k].why;
    b.onclick = () => { pref.off[k] = !pref.off[k]; save(); renderPeople(); };
    el.appendChild(b);
  }
  const s = document.getElementById('sound');
  s.textContent = pref.sound ? '🔊 소리 끄기' : '🔇 소리 켜기';
  s.className = pref.sound ? 'on' : '';
}

document.getElementById('next').onclick = playNext;
document.getElementById('sound').onclick = () => { pref.sound = !pref.sound; save(); applySound(); renderPeople(); };
document.getElementById('like').onclick = () => {
  if (!cur) return;
  pref.liked[cur.id] = true;
  pref.weight[cur.who] = Math.min(5, pref.weight[cur.who] + 0.3);
  save(); renderPeople(); renderNow();
};
document.getElementById('dislike').onclick = () => {
  if (!cur) return;
  pref.banned[cur.id] = true; delete pref.liked[cur.id];
  pref.weight[cur.who] = Math.max(0.2, pref.weight[cur.who] - 0.2);
  save(); renderPeople(); playNext();
};
document.getElementById('reset').onclick = () => {
  if (!confirm('좋아요/별로 기록과 가중치를 초기화할까요?')) return;
  pref = { weight:{}, off:{}, banned:{}, liked:{}, recent:[], sound:pref.sound };
  for (const k in PEOPLE) pref.weight[k] = startWeight(k);
  save(); renderPeople();
};

// ---- YouTube 플레이어 ----
window.onYouTubeIframeAPIReady = () => {
  cur = pick();
  player = new YT.Player('yt', {
    videoId: cur.id,
    playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0 },
    events: {
      onReady: e => { applySound(); e.target.playVideo(); renderNow(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.ENDED) playNext();
        if (e.data === YT.PlayerState.PLAYING) renderNow();
      },
      // 삭제됐거나 퍼가기 금지 영상이면 건너뜀
      onError: () => { if (cur) pref.banned[cur.id] = true; save(); setTimeout(playNext, 300); },
    },
  });
  pref.recent = [cur.id, ...pref.recent].slice(0, 40); save();
};
renderPeople();
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
