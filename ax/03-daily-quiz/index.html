<title>매일 교양 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 하루 한 장의 시험지. 위에 요일별 시간표, 가운데 한 문항씩, 풀고 나면 해설과 미니 강의가 펼쳐짐 */
:root {
  --bg: #f1f3f0;
  --paper: #ffffff;
  --ink: #18212b;
  --muted: #5b6670;
  --line: #d9dfdc;
  --accent: #2c5d8f;
  --good: #2f7d4f;
  --bad: #b5443a;
  --soft: #e7ecef;
  --c-sci: #3a8fb7; --c-pol: #8a6bb8; --c-lang: #c27b2e; --c-art: #c0567d; --c-econ: #4e9a6a; --c-intuit: #d0a321; --c-logic: #5b7fd6;
  --f-display: "Hahmlet", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --paper: #1a2128; --ink: #e6eaec; --muted: #98a4ad; --line: #2c3640; --accent: #7fb0e0; --good: #6cc28f; --bad: #ef8a7e; --soft: #222b33; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12171c; --paper: #1a2128; --ink: #e6eaec; --muted: #98a4ad; --line: #2c3640; --accent: #7fb0e0; --good: #6cc28f; --bad: #ef8a7e; --soft: #222b33; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
header h1 { margin: 0; font: 700 26px var(--f-display); letter-spacing: -.01em; }
.meta { display: flex; gap: 14px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meta b { color: var(--ink); }
.tabs { display: flex; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }

/* 요일 시간표 */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 4px; text-align: center; display: grid; gap: 2px; min-width: 0; }
.day .dw { font-size: 12px; color: var(--muted); }
.day .dn { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day .dot { width: 8px; height: 8px; border-radius: 50%; margin: 2px auto 0; }
.day[aria-current="true"] { border-color: var(--ink); border-width: 2px; padding: 7px 3px; }
.day.done .dot { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px currentColor; }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; min-width: 0; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
h2 { margin: 0; font: 700 clamp(22px, 4vw, 28px)/1.35 var(--f-display); text-wrap: balance; }
.q { margin: 0; font: 500 clamp(19px, 3.4vw, 22px)/1.55 var(--f-display); text-wrap: pretty; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }

.choices { display: grid; gap: 8px; }
.choice { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; }
.choice .k { font-family: var(--f-mono); color: var(--muted); }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--paper)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--paper)); }
.choice:disabled { cursor: default; }
.est { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.est input { font: 500 20px var(--f-mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); width: min(100%, 260px); }
.hint { font-size: 13px; color: var(--muted); }

.conf { display: grid; gap: 8px; }
.conf .row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 4px; }

.timer { font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; margin-left: auto; }
.timer.low { color: var(--bad); }
.bar { height: 4px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }

.verdict { font-weight: 600; font-size: 17px; }
.verdict.ok { color: var(--good); } .verdict.no { color: var(--bad); }
.explain { display: grid; gap: 12px; border-top: 1px dashed var(--line); padding-top: 14px; }
.learn { background: var(--soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
.learn h3, .steps h3, .deep h3 { margin: 0; font: 600 14px var(--f-body); letter-spacing: .04em; color: var(--muted); }
.steps ol { margin: 6px 0 0; padding-left: 1.4em; display: grid; gap: 4px; }
.steps li[hidden] { display: none; }

/* 결과 */
.score { display: flex; flex-wrap: wrap; gap: 20px; align-items: baseline; }
.score .big { font: 700 48px var(--f-display); font-variant-numeric: tabular-nums; }
.score .big small { font-size: 22px; color: var(--muted); }
.flags { display: grid; gap: 8px; }
.flag { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 70px 1fr; gap: 10px; min-width: 0; }
.flag .tag { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 6px; align-self: start; text-align: center; }
.flag .tag.illusion { background: color-mix(in srgb, var(--bad) 16%, var(--paper)); color: var(--bad); }
.flag .tag.lucky { background: color-mix(in srgb, var(--c-intuit) 22%, var(--paper)); color: var(--ink); }
.flag .tag.solid { background: color-mix(in srgb, var(--good) 16%, var(--paper)); color: var(--good); }
.flag .tag.gap { background: var(--soft); color: var(--muted); }
.deep textarea { width: 100%; min-height: 120px; font: inherit; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); resize: vertical; }
.deep { display: grid; gap: 10px; }
.feedback { background: var(--soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }

/* 기록 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.stat .n { font: 700 26px var(--f-display); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--muted); }
.catbars { display: grid; gap: 8px; }
.catbar { display: grid; grid-template-columns: 92px 1fr 54px; gap: 10px; align-items: center; font-size: 14px; }
.catbar .track { height: 10px; background: var(--soft); border-radius: 5px; overflow: hidden; }
.catbar .track span { display: block; height: 100%; border-radius: 5px; }
.catbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.hist { display: grid; gap: 6px; font-size: 14px; }
.hist div { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.hist span:last-child { font-variant-numeric: tabular-nums; }
.status { font-size: 14px; color: var(--muted); }
.status.err { color: var(--bad); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.loading::before { content: ""; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .loading::before { animation: none; } .bar > span { transition: none; } }
/* 이야깃거리 */
.issues { display: grid; gap: 12px; }
.issue { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.issue.fun { background: color-mix(in srgb, var(--c-intuit) 10%, var(--paper)); }
.i-title { margin: 0; font: 600 18px/1.45 var(--f-display); text-wrap: balance; }
.i-why { font-size: 15px; color: var(--muted); }
.i-why b { color: var(--ink); font-weight: 600; margin-right: 4px; }
.i-talk { font-size: 15px; background: var(--soft); border-radius: 8px; padding: 8px 10px; }
.i-src { font-size: 13px; color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
.i-src:hover { text-decoration: underline; }
@media (max-width: 480px) { .sheet { padding: 16px; } .day .dn { font-size: 11px; } .catbar { grid-template-columns: 76px 1fr 44px; } }
</style>

<div class="wrap">
  <header>
    <h1>매일 교양 퀴즈</h1>
    <div class="tabs" role="group" aria-label="화면">
      <button id="tab-today" aria-pressed="true">오늘</button>
      <button id="tab-issues" aria-pressed="false">이야깃거리</button>
      <button id="tab-stats" aria-pressed="false">내 기록</button>
    </div>
  </header>
  <div class="meta" id="meta"></div>
  <div class="week" id="week" aria-label="요일별 분야"></div>
  <main id="main"></main>
</div>

<script>
// ───────── 분야와 요일 ─────────
const CATS = {
  sci:    { name: '과학',        desc: '물리·화학·생명과학·지구과학의 핵심 개념과 원리' },
  pol:    { name: '정치·사회',   desc: '국내외 정치 제도, 정치사상, 국제관계, 사회학의 기본 개념. 특정 정당이나 현역 정치인 평가 없이 중립적으로' },
  lang:   { name: '언어·철학',   desc: '언어학, 한국어 규범, 논리학, 동서양 철학 사상' },
  art:    { name: '예술·역사',   desc: '미술사, 음악사, 문학, 세계사와 한국사의 주요 흐름' },
  econ:   { name: '경제',        desc: '미시·거시경제 기본 개념, 경제사, 행동경제학' },
  intuit: { name: '직관 훈련',   desc: '페르미 추정, 확률·통계 직관, 인지 편향. 빠르게 감을 잡고 근거를 따져 보는 연습', timed: true },
  logic:  { name: '논리 스프린트', desc: '삼단논법, 조건문, 수열, 참·거짓 퍼즐 등 짧은 시간에 논리를 전개하는 문제', timed: true },
};
const WEEK = ['logic', 'sci', 'pol', 'lang', 'art', 'econ', 'intuit']; // 일~토
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const SECONDS = 60;

// ───────── 기본 문제 (Claude 출제를 쓸 수 없을 때) ─────────
const BANK = {
  sci: { items: [
    { type: 'mc', topic: '빛의 산란', q: '맑은 날 하늘이 파랗게 보이는 주된 이유는?', choices: ['바다의 색이 하늘에 반사되어서', '짧은 파장의 빛이 공기 분자에 더 강하게 산란되어서', '오존층이 붉은빛을 흡수해서', '대기 중 수증기가 파란색이어서'], answer: 1,
      explain: '레일리 산란의 세기는 파장의 네제곱에 반비례합니다. 파장이 짧은 파란빛이 붉은빛보다 훨씬 많이 흩어져 하늘 전체에서 우리 눈으로 들어옵니다.',
      learn: '같은 원리로 해질녘에는 빛이 대기를 길게 통과하면서 파란빛이 대부분 흩어져 나가고, 남은 붉은빛이 하늘을 물들입니다. 구름이 하얀 것은 물방울이 빛의 파장보다 커서 모든 색을 비슷하게 산란하는 미 산란 때문입니다. 산란 개념은 레이더, 의료 영상, 대기 오염 측정에도 쓰입니다.' },
    { type: 'mc', topic: '열역학 제2법칙', q: '외부와 에너지·물질을 주고받지 않는 고립계의 엔트로피는 시간이 지나면 어떻게 되는가?', choices: ['반드시 줄어든다', '항상 일정하다', '줄어들지 않는다(같거나 늘어난다)', '주기적으로 늘었다 줄었다 한다'], answer: 2,
      explain: '열역학 제2법칙에 따르면 고립계의 엔트로피는 감소하지 않습니다. 가역 과정이면 그대로, 실제의 비가역 과정에서는 증가합니다.',
      learn: '엔트로피는 흔히 무질서도로 설명되지만, 더 정확히는 같은 거시 상태를 만드는 미시 상태의 수와 관련됩니다(볼츠만, S = k log W). 냉장고처럼 국소적으로 엔트로피를 낮추는 장치는 외부로 더 많은 엔트로피를 내보냅니다. 생명체도 마찬가지로 먹고 열을 내보내며 질서를 유지합니다.' },
    { type: 'mc', topic: 'mRNA 백신', q: 'mRNA 백신의 작동 방식으로 옳은 것은?', choices: ['약하게 만든 바이러스를 주입한다', '세포가 항원 단백질을 잠깐 만들도록 설계도를 전달한다', '사람의 DNA를 바꿔 면역을 영구히 만든다', '항체를 직접 주입한다'], answer: 1,
      explain: 'mRNA는 세포질에서 리보솜에 의해 단백질로 번역된 뒤 분해됩니다. 핵 안의 DNA에 들어가지 않으며, 만들어진 항원 단백질을 보고 면역계가 학습합니다.',
      learn: '분자생물학의 중심 원리는 DNA → RNA → 단백질의 정보 흐름입니다. mRNA는 그중 단백질 설계도를 나르는 전령입니다. 불안정한 mRNA를 지질 나노입자로 감싸 세포까지 보내는 기술이 실용화의 열쇠였고, 이 연구로 카리코와 와이스먼이 2023년 노벨 생리의학상을 받았습니다.' },
    { type: 'mc', topic: '상대성이론', q: 'GPS 위성의 시계를 보정해야 하는 이유와 가장 관련 깊은 것은?', choices: ['뉴턴의 만유인력 법칙만', '특수·일반 상대성이론의 시간 효과', '양자 얽힘', '도플러 효과만'], answer: 1,
      explain: '빠르게 움직이는 위성 시계는 특수상대성이론에 따라 느려지고, 중력이 약한 높은 궤도에서는 일반상대성이론에 따라 빨라집니다. 합치면 하루 약 38마이크로초가 빨라져 보정하지 않으면 위치 오차가 하루 수 km씩 쌓입니다.',
      learn: '특수상대성이론(1905)은 빛의 속도가 모든 관성 관찰자에게 같다는 데서 출발해 시간과 공간이 관찰자에 따라 달라짐을 보였습니다. 일반상대성이론(1915)은 중력을 시공간의 휘어짐으로 설명합니다. 일상에서 상대성이론이 실제로 쓰이는 대표 사례가 GPS입니다.' },
    { type: 'mc', topic: '판 구조론', q: '히말라야산맥이 만들어진 원인으로 가장 알맞은 것은?', choices: ['화산 분화가 쌓여서', '인도판과 유라시아판이 충돌해서', '빙하가 땅을 깎아서', '해저가 갈라지며 솟아서'], answer: 1,
      explain: '인도판이 북쪽으로 이동해 유라시아판과 충돌하면서 지각이 밀려 올라갔고, 지금도 조금씩 높아지고 있습니다.',
      learn: '판 구조론은 지구 겉면이 여러 판으로 나뉘어 맨틀 위를 천천히 움직인다는 이론입니다. 판이 멀어지는 곳에서는 해령, 부딪치는 곳에서는 습곡산맥이나 해구, 어긋나는 곳에서는 변환단층이 생깁니다. 베게너의 대륙이동설에서 시작해 1960년대 해저 확장 증거로 완성되었습니다.' },
  ], deep: { q: '엔트로피 증가 법칙이 있는데도 생명체가 질서 있는 구조를 유지할 수 있는 이유를 설명해 보세요.', answer: '생명체는 고립계가 아니라 열린계입니다. 음식이나 햇빛으로 질서도가 높은(엔트로피가 낮은) 에너지를 받아들이고, 열과 노폐물로 더 많은 엔트로피를 바깥에 내보냅니다. 그래서 몸 안의 엔트로피는 낮게 유지되지만, 생명체와 환경을 합친 전체 엔트로피는 증가합니다. 제2법칙은 깨지지 않습니다.' } },

  pol: { items: [

  lang: { items: [

  ], deep: { q: '"되"와 "돼"를 헷갈리는 친구에게, 외우지 않고도 구별하는 방법을 설명해 보세요.', answer: '"돼"는 "되어"를 줄인 말입니다. 그 자리에 "되어"를 넣어 자연스러우면 "돼", 어색하면 "되"를 씁니다. 더 쉽게는 "하"와 "해"를 넣어 봅니다. "하"가 어울리면 "되"(되고, 되니), "해"가 어울리면 "돼"(돼요, 돼서)입니다.' } },

// ───────── 유틸 ─────────
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = new Date();
const TODAY = dateKey(today);
const fmtNum = n => Number(n).toLocaleString('ko-KR');
function shuffleChoices(item) {
  if (item.type !== 'mc') return item;
  const order = item.choices.map((_, i) => i).sort(() => Math.random() - .5);
  return { ...item, choices: order.map(i => item.choices[i]), answer: order.indexOf(item.answer) };
}

// ───────── 저장소: 로그인했으면 내 기록(비공개), 아니면 이 브라우저 ─────────
const store = {
  mode: 'local', db: null, uid: null,
  _l(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('dq:' + k)); localStorage.setItem('dq:' + k, JSON.stringify(v)); } catch { return null; } },
  async getQuiz(key) {
    if (this.db) { const s = await this.db.collection('data/users/' + this.uid).doc('quiz-' + key).get(); return s.exists ? s.data().quiz : null; }
    return this._l('quiz-' + key);
  },
  async putQuiz(key, quiz) {
    if (this.db) return this.db.collection('data/users/' + this.uid).doc('quiz-' + key).set({ kind: 'quiz', date: TODAY, quiz });
    this._l('quiz-' + key, quiz);
  },
  async addSession(s) {
    if (this.db) return this.db.collection('data/users/' + this.uid).doc('sess-' + s.id).set({ kind: 'session', ...s });
    const all = this._l('sessions') || []; all.push(s); this._l('sessions', all.slice(-400));
  },
  async updateSession(id, patch) {
    if (this.db) return this.db.collection('data/users/' + this.uid).doc('sess-' + id).update(patch);
    const all = this._l('sessions') || []; const s = all.find(x => x.id === id); if (s) Object.assign(s, patch); this._l('sessions', all);
  },
  async sessions() {
    if (this.db) { const q = await this.db.collection('data/users/' + this.uid).where('kind', '==', 'session').get(); return q.docs.map(d => d.data()); }
    return this._l('sessions') || [];
  },
};

let sample = null;
let sessions = [];
const state = { view: 'home', cat: WEEK[today.getDay()], quiz: null, source: '', idx: 0, answers: [], picked: null, timer: null, left: SECONDS, startedAt: 0, sessionId: null, deepDone: null };

// ───────── Claude 출제 ─────────
function weakTopics() {
  const wrong = [];
  for (const s of [...sessions].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 10))
    for (const r of s.results || []) if (!r.correct) wrong.push(`${CATS[s.cat]?.name || s.cat}: ${r.topic}`);
  return [...new Set(wrong)].slice(0, 8);
}
function recentTopics(cat) {
  return [...new Set(sessions.filter(s => s.cat === cat).flatMap(s => (s.results || []).map(r => r.topic)))].slice(-25);
}
function buildPrompt(cat) {
  const c = CATS[cat];
  return `너는 대학 교양 수업 강사다. 날짜 ${TODAY}, 분야 "${c.name}"의 데일리 퀴즈를 만든다. 범위: ${c.desc}.
목적: 먼저 문제로 학습자가 얼마나 이해하고 있는지 진단하고, 풀고 나면 해설과 미니 강의로 지식을 넓힌다.
규칙:
- 한국어. 대학 교양 수준. 지엽적인 암기보다 개념 이해와 적용을 묻는다.
- 학계에서 확립된 사실만 쓴다. 최근 시사 뉴스는 출제하지 않는다. 정치·사회는 제도, 개념, 사상, 역사 위주로 중립적으로 쓴다.
- 정확히 5문항, 모두 다른 주제. 난이도는 쉬움 1, 보통 3, 어려움 1.
- type은 "mc"(4지선다)${c.timed ? ' 또는 "estimate"(숫자 하나로 답하는 추정 문제. 정답이 널리 알려진 값일 때만. 1~2문항)' : '만 쓴다'}.
- mc: choices 4개, answer는 정답 인덱스(0~3). 정답 위치를 골고루 섞는다. 오답도 그럴듯하게.
- estimate: value(숫자), unit(단위).
- explain: 왜 정답인지 2~3문장. learn: 이 개념을 넓히는 미니 강의 3~5문장(관련 개념, 인물, 실제 사례).
- steps: ${c.timed ? '정답에 빠르게 도달하는 추론 단계 3~5개, 각 한 문장. 반드시 넣는다.' : '빈 배열.'}
- 학습자가 최근 틀린 주제: ${weakTopics().join(', ') || '없음'}. 이 중 이 분야와 관련된 것이 있으면 연결된 개념을 1문항 넣되 같은 문제는 피한다.
- 이미 낸 주제(반복 금지): ${recentTopics(cat).join(', ') || '없음'}.
- 마지막에 오늘 문항들을 엮는 서술형 질문 deep 하나: q(질문), answer(모범답안 3~4문장).
JSON만 답한다:
{"items":[{"type":"mc","topic":"짧은 주제명","q":"","choices":["","","",""],"answer":0,"explain":"","learn":"","steps":[]}],"deep":{"q":"","answer":""}}`;
}
function validQuiz(j) {
  if (!j || !Array.isArray(j.items)) return null;
  const items = j.items.filter(it => it && typeof it.q === 'string' && typeof it.explain === 'string' && (
    (it.type === 'mc' && Array.isArray(it.choices) && it.choices.length === 4 && Number.isInteger(it.answer) && it.answer >= 0 && it.answer < 4) ||
    (it.type === 'estimate' && Number(it.value) > 0)
  )).map(it => ({ ...it, topic: String(it.topic || '주제'), learn: String(it.learn || ''), steps: Array.isArray(it.steps) ? it.steps.map(String) : [], value: it.value != null ? Number(it.value) : undefined }));
  if (items.length < 3) return null;
  const deep = j.deep && typeof j.deep.q === 'string' ? { q: j.deep.q, answer: String(j.deep.answer || '') } : null;
  return { items, deep };
}

let genCtl = null;
async function generate(cat, fresh) {
  const main = $('#main');
  main.innerHTML = `<section class="sheet"><div class="loading">Claude가 오늘의 ${esc(CATS[cat].name)} 문제를 출제하고 있어요. 30초~1분 걸릴 수 있어요.</div><div><button class="btn" id="stop">그만두고 기본 문제로</button></div></section>`;
  genCtl = new AbortController();
  $('#stop').onclick = () => genCtl.abort();
  try {
    const j = await sample.json(buildPrompt(cat), { signal: genCtl.signal, cache: fresh ? false : { gcTime: 86400000 } });
    const quiz = validQuiz(j);
    if (!quiz) throw { code: 'invalid_json' };
    quiz.items = quiz.items.map(shuffleChoices);
    const key = `${TODAY}-${cat}` + (fresh ? '-' + Date.now() : '');
    await store.putQuiz(`${TODAY}-${cat}`, { ...quiz, key }).catch(() => {});
    start(cat, quiz, 'claude');
  } catch (e) {
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') sample = null;
    const msg = e?.code === 'cancelled' ? '' : e?.code === 'rate_limited' ? 'Claude 사용량이 많아 잠시 쉬어야 해요. 오늘은 기본 문제로 풀어 볼게요.' : e?.code === 'not_granted' ? '' : '출제가 매끄럽지 않았어요. 기본 문제로 시작할게요.';
    start(cat, { items: BANK[cat].items.map(shuffleChoices), deep: BANK[cat].deep }, 'bank', msg);
  }
}

  $('#week').querySelectorAll('.day').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; state.view = 'home'; setTab('today'); render(); });

function streak() {
  const days = new Set(sessions.map(s => s.date));
  let n = 0; const d = new Date(today);
  if (!days.has(dateKey(d))) d.setDate(d.getDate() - 1);
  while (days.has(dateKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderMeta() {
  const total = sessions.reduce((a, s) => a + (s.total || 0), 0), right = sessions.reduce((a, s) => a + (s.score || 0), 0);

}

// ───────── 화면: 문제 ─────────
function start(cat, quiz, source, note = '') {
  Object.assign(state, { view: 'quiz', cat, quiz, source, idx: 0, answers: [], picked: null, deepDone: null, sessionId: `${TODAY}-${cat}-${Date.now().toString(36)}` });
  if (note) state.note = note; else state.note = '';
  renderQuestion();
}
function stopTimer() { clearInterval(state.timer); state.timer = null; }
function renderQuestion() {
  stopTimer();
  const { quiz, idx, cat } = state, it = quiz.items[idx], c = CATS[cat];
  state.picked = null; state.left = SECONDS; state.startedAt = Date.now();
  const n = quiz.items.length;
  $('#main').innerHTML = `<section class="sheet">
    ${state.note ? `<p class="status">${esc(state.note)}</p>` : ''}
    <div class="eyebrow"><span class="chip"><i style="background:var(--c-${cat})"></i>${esc(c.name)}</span><span>${idx + 1} / ${n}</span><span>· ${esc(it.topic)}</span>${state.source === 'claude' ? '<span>· Claude 출제</span>' : ''}${c.timed ? `<span class="timer" id="timer">${SECONDS}s</span>` : ''}</div>
    <div class="bar"><span style="width:${idx / n * 100}%"></span></div>
    <p class="q">${esc(it.q)}</p>
    <div id="answer">${it.type === 'mc'
      ? `<div class="choices">${it.choices.map((ch, i) => `<button class="choice" data-i="${i}" aria-pressed="false"><span class="k">${'ABCD'[i]}</span><span>${esc(ch)}</span></button>`).join('')}</div>`
      : `<div class="est"><input id="est" inputmode="decimal" placeholder="숫자로 입력" autocomplete="off"><span>${esc(it.unit || '')}</span></div><p class="hint">정답의 1/3배~3배 안이면 맞은 것으로 쳐요. 자릿수 감각이 핵심이에요.</p>`}</div>
    <div class="conf" id="conf">
      <p class="hint">얼마나 확신하나요? 고르면 바로 제출돼요.</p>
      <div class="row">
        <button class="btn" data-c="sure" disabled>확신해요</button>
        <button class="btn" data-c="half" disabled>반반이에요</button>
        <button class="btn" data-c="guess" disabled>감으로 찍었어요</button>
      </div>
    </div>
    <div id="after"></div>
  </section>`;
  const confBtns = [...document.querySelectorAll('#conf button')];
  const enable = on => confBtns.forEach(b => b.disabled = !on);
  if (it.type === 'mc') {
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      state.picked = +b.dataset.i;
      document.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', x === b));
      enable(true);
    });
  } else {
    const inp = $('#est');
    inp.oninput = () => { const v = parseFloat(inp.value.replace(/,/g, '')); state.picked = v > 0 ? v : null; enable(state.picked != null); };
    inp.focus();
  }
  confBtns.forEach(b => b.onclick = () => submit(b.dataset.c));
  if (c.timed) {
    state.timer = setInterval(() => {
      state.left--;
      const t = $('#timer'); if (!t) return stopTimer();
      t.textContent = state.left >= 0 ? state.left + 's' : '시간 초과';
      t.classList.toggle('low', state.left <= 10);
    }, 1000);
  }
}
function judge(it, picked) {
  if (it.type === 'mc') return picked === it.answer;
  return Math.abs(Math.log10(picked / it.value)) <= Math.log10(3);
}
function submit(conf) {
  stopTimer();
  const it = state.quiz.items[state.idx];
  const correct = judge(it, state.picked);
  const secs = Math.round((Date.now() - state.startedAt) / 1000);
  state.answers.push({ topic: it.topic, correct, conf, secs, picked: state.picked });
  document.querySelectorAll('#conf button, .choice').forEach(b => b.disabled = true);
  $('#conf').hidden = true;
  if (it.type === 'mc') {
    document.querySelectorAll('.choice').forEach(b => { const i = +b.dataset.i; if (i === it.answer) b.classList.add('right'); else if (i === state.picked) b.classList.add('wrong'); });
  } else $('#est').disabled = true;
  const verdict = correct ? (conf === 'guess' ? '맞았어요. 그런데 감으로 맞힌 거라 해설을 꼭 읽어 두세요.' : '맞았어요.') : (conf === 'sure' ? '틀렸어요. 확신했던 문제라 착각하던 지식일 수 있어요.' : '틀렸어요.');
  const estLine = it.type === 'estimate' ? `<p>정답: <b>${fmtNum(it.value)} ${esc(it.unit || '')}</b> · 내 답은 정답의 ${(state.picked / it.value).toFixed(2)}배</p>` : '';
  const last = state.idx === state.quiz.items.length - 1;
  $('#after').innerHTML = `<div class="explain">
    <p class="verdict ${correct ? 'ok' : 'no'}">${verdict}${CATS[state.cat].timed ? ` <span class="hint">(${secs}초)</span>` : ''}</p>
    ${estLine}
    <p>${esc(it.explain)}</p>
    ${it.steps?.length ? `<div class="steps"><h3>논리 전개</h3><ol>${it.steps.map((s, i) => `<li ${i ? 'hidden' : ''}>${esc(s)}</li>`).join('')}</ol>${it.steps.length > 1 ? '<button class="btn ghost" id="more-step">다음 단계 보기 →</button>' : ''}</div>` : ''}
    ${it.learn ? `<div class="learn"><h3>더 알아보기</h3><p>${esc(it.learn)}</p></div>` : ''}
    <div><button class="btn primary" id="next">${last ? '결과 보기' : '다음 문제'}</button></div>
  </div>`;
  const more = $('#more-step');
  if (more) more.onclick = () => { const h = document.querySelector('.steps li[hidden]'); if (h) h.hidden = false; if (!document.querySelector('.steps li[hidden]')) more.remove(); };
  $('#next').onclick = () => { if (last) finish(); else { state.idx++; renderQuestion(); } };
  $('#next').focus();
}

// ───────── 화면: 결과 ─────────
async function finish() {
  const a = state.answers, score = a.filter(x => x.correct).length;
  const sess = { id: state.sessionId, date: TODAY, at: Date.now(), cat: state.cat, source: state.source, score, total: a.length,
    results: a.map(x => ({ topic: x.topic, correct: x.correct, conf: x.conf, secs: x.secs })) };
  sessions.push(sess);
  let saveNote = '';
  try { await store.addSession(sess); } catch { saveNote = '기록을 저장하지 못했어요. 이 결과는 이 화면에서만 볼 수 있어요.'; }
  renderMeta(); renderWeek();
  state.view = 'result';
  renderResult(saveNote);
}
function classify(x) {
  if (!x.correct && x.conf === 'sure') return ['illusion', '착각'];
  if (x.correct && x.conf === 'guess') return ['lucky', '운'];
  if (x.correct) return ['solid', '아는 것'];
  return ['gap', '빈칸'];
}
function renderResult(saveNote = '') {
  const a = state.answers, score = a.filter(x => x.correct).length, deep = state.quiz.deep;
  const sure = a.filter(x => x.conf === 'sure'), sureRight = sure.filter(x => x.correct).length;
  const ill = a.filter(x => !x.correct && x.conf === 'sure').length;
  $('#main').innerHTML = `<section class="sheet">
    <div class="eyebrow"><span class="chip"><i style="background:var(--c-${state.cat})"></i>${esc(CATS[state.cat].name)}</span><span>오늘의 결과</span></div>
    <div class="score"><div class="big">${score}<small> / ${a.length}</small></div>
      <p class="lead">${sure.length ? `확신한 ${sure.length}문항 중 ${sureRight}문항 정답. ` : ''}${ill ? `확신했지만 틀린 ${ill}문항은 다시 볼 가치가 가장 커요.` : score === a.length ? '전부 맞혔어요.' : '틀린 주제는 다음 출제 때 연결 개념으로 다시 나와요.'}</p></div>
    ${saveNote ? `<p class="status err">${esc(saveNote)}</p>` : ''}
    <div class="flags">${a.map(x => { const [k, l] = classify(x); return `<div class="flag"><span class="tag ${k}">${l}</span><span>${esc(x.topic)}${CATS[state.cat].timed ? ` <span class="hint">· ${x.secs}초</span>` : ''}</span></div>`; }).join('')}</div>
    <p class="hint">착각 = 확신했는데 틀림 · 운 = 찍었는데 맞음 · 빈칸 = 몰라서 틀림 · 아는 것 = 알고 맞힘</p>
    ${deep ? `<div class="deep"><h3>한 걸음 더 · 서술형</h3><p class="q" style="font-size:19px">${esc(deep.q)}</p>
      <textarea id="deep-answer" placeholder="3~4문장으로 내 생각을 써 보세요."></textarea>
      <div class="conf"><div class="row"><button class="btn primary" id="deep-go">${sample ? 'Claude에게 채점받기' : '모범답안과 비교하기'}</button></div></div>
      <div id="deep-out"></div></div>` : ''}
    <div class="conf"><div class="row"><button class="btn" id="again">다른 분야 고르기</button><button class="btn" id="to-stats">내 기록 보기</button></div></div>
  </section>`;
  $('#again').onclick = () => { state.view = 'home'; render(); };
  $('#to-stats').onclick = () => { setTab('stats'); };
  if (deep) $('#deep-go').onclick = () => gradeDeep(deep);
}
async function gradeDeep(deep) {
  const ans = $('#deep-answer').value.trim(), out = $('#deep-out'), btn = $('#deep-go');
  if (!ans) { out.innerHTML = '<p class="status">먼저 답을 써 주세요.</p>'; return; }
  const model = `<div class="feedback"><h3 style="margin:0;font-size:14px;color:var(--muted)">모범답안</h3><p>${esc(deep.answer)}</p></div>`;
  if (!sample) { out.innerHTML = model; return; }
  btn.disabled = true; out.innerHTML = '<div class="loading">채점 중이에요.</div>';
  try {
    const r = await sample.json(`대학 교양 수업 서술형 답안을 채점한다. 친절하지만 정확하게.
질문: ${deep.q}
모범답안: ${deep.answer}
학생 답: ${ans.slice(0, 3000)}
0~3점(3: 핵심 개념을 정확히 설명, 2: 대체로 맞지만 빠진 것 있음, 1: 일부만 맞음, 0: 틀리거나 무관). feedback은 잘한 점 한 문장, 빠지거나 틀린 개념 1~2문장. JSON만: {"score":0,"feedback":""}`, { cache: false });
    const sc = Math.max(0, Math.min(3, Number(r?.score) || 0));
    out.innerHTML = `<div class="feedback"><p class="verdict ${sc >= 2 ? 'ok' : 'no'}">${sc} / 3점</p><p>${esc(r?.feedback || '')}</p></div>${model}`;
    store.updateSession(state.sessionId, { deepScore: sc }).catch(() => {});
    const s = sessions.find(x => x.id === state.sessionId); if (s) s.deepScore = sc;
  } catch (e) {
    if (e?.code === 'not_granted' || e?.code === 'sampling_disabled') sample = null;
    out.innerHTML = `<p class="status">채점을 받지 못했어요. 모범답안과 직접 비교해 보세요.</p>${model}`;
  } finally { btn.disabled = false; }
}

// ───────── 화면: 기록 ─────────
function renderStats() {
  const total = sessions.reduce((a, s) => a + (s.total || 0), 0), right = sessions.reduce((a, s) => a + (s.score || 0), 0);
  const all = sessions.flatMap(s => s.results || []);
  const sure = all.filter(r => r.conf === 'sure'), ill = sure.filter(r => !r.correct).length;
  const byCat = Object.keys(CATS).map(k => { const ss = sessions.filter(s => s.cat === k); const t = ss.reduce((a, s) => a + s.total, 0), r = ss.reduce((a, s) => a + s.score, 0); return { k, t, pct: t ? Math.round(r / t * 100) : null }; });
  const wrong = weakTopics();
  const recent = [...sessions].sort((a, b) => b.at - a.at).slice(0, 12);
  $('#main').innerHTML = `<section class="sheet">
    <h2>내 기록</h2>
    ${store.mode === 'local' ? '<p class="hint">로그인 정보를 확인할 수 없어 이 브라우저에만 저장하고 있어요.</p>' : '<p class="hint">기록은 나만 볼 수 있게 저장돼요.</p>'}
    <div class="stats">
      <div class="stat"><div class="n">${streak()}</div><div class="l">연속 학습일</div></div>
      <div class="stat"><div class="n">${sessions.length}</div><div class="l">푼 세트</div></div>
      <div class="stat"><div class="n">${total ? Math.round(right / total * 100) : 0}%</div><div class="l">전체 정답률</div></div>
      <div class="stat"><div class="n">${sure.length ? Math.round((sure.length - ill) / sure.length * 100) + '%' : '-'}</div><div class="l">확신했을 때 정답률</div></div>
    </div>
    <h3 style="margin:0;font:600 15px var(--f-body)">분야별 정답률</h3>
    <div class="catbars">${byCat.map(b => `<div class="catbar"><span>${esc(CATS[b.k].name)}</span><div class="track"><span style="width:${b.pct ?? 0}%;background:var(--c-${b.k})"></span></div><span class="v">${b.pct == null ? '-' : b.pct + '%'}</span></div>`).join('')}</div>
    ${wrong.length ? `<h3 style="margin:0;font:600 15px var(--f-body)">최근 틀린 주제</h3><p class="lead">${wrong.map(esc).join(' · ')}</p><p class="hint">Claude가 출제할 때 이 주제들과 연결된 개념을 다시 물어봐요.</p>` : ''}
    <h3 style="margin:0;font:600 15px var(--f-body)">최근 풀이</h3>
    ${recent.length ? `<div class="hist">${recent.map(s => `<div><span>${esc(s.date)}</span><span>${esc(CATS[s.cat]?.name || s.cat)}${s.source === 'claude' ? ' · Claude 출제' : ''}</span><span>${s.score}/${s.total}${s.deepScore != null ? ` · 서술 ${s.deepScore}/3` : ''}</span></div>`).join('')}</div>` : '<p class="lead">아직 기록이 없어요. 오늘의 문제를 풀면 여기에 쌓여요.</p>'}
  </section>`;
}

// ───────── 라우팅 ─────────
function setTab(t) {
  ['today', 'issues', 'stats'].forEach(x => $('#tab-' + x).setAttribute('aria-pressed', t === x));
  const side = v => v === 'stats' || v === 'issues';
  if (side(t)) { stopTimer(); if (!side(state.view)) state.prevView = state.view; state.view = t; }
  else if (side(state.view)) state.view = state.prevView === 'quiz' ? 'quiz' : state.prevView === 'result' ? 'result' : 'home';
  render();
}
$('#tab-today').onclick = () => setTab('today');
$('#tab-issues').onclick = () => setTab('issues');
$('#tab-stats').onclick = () => setTab('stats');

// ───────── 이야깃거리: 매일 아침 예약 작업이 issues/<날짜> 문서로 채움 ─────────
let issuesDb = null, issueDays = null, issueIdx = 0, issueErr = '';
const ISSUE_CATS = { econ: '경제', world: '국제', society: '사회', science: '과학', tech: 'IT·기술', culture: '문화', fun: '웃긴 소식', sports: '스포츠', life: '생활' };
const safeUrl = u => /^https:\/\//.test(String(u || '')) ? String(u) : null;
async function loadIssues() {
  if (!issuesDb) return;
  try {
    const q = await issuesDb.collection('issues').orderBy('date', 'desc').limit(7).get();
    issueDays = q.docs.map(d => d.data()).filter(d => Array.isArray(d.items));
    issueErr = '';
  } catch { issueErr = '이야깃거리를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; issueDays = issueDays || []; }
  if (state.view === 'issues') renderIssues();
}
function shareText(day) {
  return `[${day.date} 오늘의 이야깃거리]\n` + day.items.map((it, n) => `${n + 1}. ${it.title}\n- ${it.summary}${it.talk ? `\n💬 ${it.talk}` : ''}`).join('\n\n');
}
function renderIssues() {
  const main = $('#main');
  if (!issuesDb) {
    main.innerHTML = `<section class="sheet"><h2>오늘의 이야깃거리</h2><p class="lead">친구나 동료와 나눌 만한 최근 소식을 매일 아침 정리해 두는 곳이에요. claude.ai에서 이 페이지를 열면 볼 수 있어요.</p></section>`;
    return;
  }
  if (!issueDays) { main.innerHTML = `<section class="sheet"><div class="loading">이야깃거리를 불러오는 중이에요.</div></section>`; return; }
  if (!issueDays.length) {
    main.innerHTML = `<section class="sheet"><h2>오늘의 이야깃거리</h2><p class="lead">아직 올라온 소식이 없어요. 매일 아침 7시 30분쯤 새 소식이 채워져요.</p>${issueErr ? `<p class="status err">${esc(issueErr)}</p>` : ''}</section>`;
    return;
  }
  const day = issueDays[Math.min(issueIdx, issueDays.length - 1)];
  main.innerHTML = `<section class="sheet">
    <div class="eyebrow"><span>${esc(day.date)}${day.date === TODAY ? ' · 오늘' : ''}</span><span>· ${day.items.length}개</span></div>
    <h2>나눌 만한 이야깃거리</h2>
    <p class="lead">${esc(day.intro || '점심이나 단톡방에서 꺼내기 좋은 소식들이에요. 출처 링크로 원문을 확인할 수 있어요.')}</p>
    ${issueDays.length > 1 ? `<div class="conf"><div class="row">${issueDays.map((d, n) => `<button class="btn ${n === issueIdx ? 'primary' : ''}" data-day="${n}">${esc(d.date.slice(5).replace('-', '/'))}</button>`).join('')}</div></div>` : ''}
    <div class="issues">${day.items.map(it => { const u = safeUrl(it.source?.url); return `<article class="issue ${it.tone === 'fun' ? 'fun' : ''}">
      <div class="eyebrow"><span class="chip">${esc(ISSUE_CATS[it.cat] || it.cat || '이슈')}</span>${it.tone === 'fun' ? '<span>가볍게 웃고 넘기기</span>' : '<span>인사이트</span>'}</div>
      <h3 class="i-title">${esc(it.title)}</h3>
      <p>${esc(it.summary)}</p>
      ${it.why ? `<p class="i-why"><b>왜 볼 만한가</b> ${esc(it.why)}</p>` : ''}
      ${it.talk ? `<p class="i-talk">💬 ${esc(it.talk)}</p>` : ''}
      ${u ? `<a class="i-src" href="${esc(u)}" target="_blank" rel="noopener">출처: ${esc(it.source?.name || '원문')} ↗</a>` : ''}
    </article>`; }).join('')}</div>
    <div class="conf"><div class="row"><button class="btn" id="copy-issues">단톡방용으로 복사</button></div><p class="hint" id="copy-note"></p></div>
    ${issueErr ? `<p class="status err">${esc(issueErr)}</p>` : ''}
  </section>`;
  main.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { issueIdx = +b.dataset.day; renderIssues(); });
  $('#copy-issues').onclick = async () => {
    const txt = shareText(day), note = $('#copy-note');
    try { await navigator.clipboard.writeText(txt); note.textContent = '복사했어요. 단톡방에 붙여 넣으세요.'; }
    catch { note.innerHTML = ''; const ta = document.createElement('textarea'); ta.value = txt; ta.style.width = '100%'; ta.rows = 8; note.appendChild(ta); ta.select(); }
  };
}

function render() {
  renderMeta(); renderWeek();
  if (state.view === 'issues') renderIssues();
  else if (state.view === 'stats') renderStats();
  else if (state.view === 'quiz') {
    if (state.answers.length > state.idx) { if (state.idx === state.quiz.items.length - 1) { state.view = 'result'; return renderResult(); } state.idx++; }
    renderQuestion();
  }
  else if (state.view === 'result') renderResult();
  else renderHome();
}

// ───────── 시작 ─────────
render();
(async () => {
  if (!window.claude?.use) return;
  const [s, db, user] = await Promise.all([claude.use('sample'), claude.use('db'), claude.use('user')]);
  sample = s;
  issuesDb = db; loadIssues();
  const uid = user ? await user.id().catch(() => null) : null;
  if (db && uid) { store.db = db; store.uid = uid; store.mode = 'db'; }
  try { sessions = await store.sessions(); } catch { sessions = store._l('sessions') || []; store.db = null; store.mode = 'local'; }
  if (state.view === 'home' || state.view === 'stats') render(); else { renderMeta(); renderWeek(); }
})();
if (!window.claude?.use) { sessions = store._l('sessions') || []; render(); }
</script>
