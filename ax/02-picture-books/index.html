<title>그림책 서재</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 번에 한 장면만 펼치는 그림책. 위는 그림, 아래는 짧은 글, 맨 아래 넘김 버튼 */
:root {
  --bg: #eef2ef;        /* 크레타 석회벽 */
  --card: #ffffff;
  --fg: #1c2a33;
  --muted: #5a6a71;
  --sea: #1f5f8b;       /* 에게해 */
  --ochre: #b8772f;     /* 크레타 흙 */
  --line: #d5ddd9;
  --font-kid: "Jua", "Gowun Dodum", system-ui, sans-serif;
  --font-book: "Gowun Batang", "Batang", serif;
  --font-ui: "Gowun Dodum", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f171c; --card: #172229; --fg: #e6ecea; --muted: #97a6ac; --sea: #7db4da; --ochre: #e1a560; --line: #2a3840; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f171c; --card: #172229; --fg: #e6ecea; --muted: #97a6ac; --sea: #7db4da; --ochre: #e1a560; --line: #2a3840; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 14px; }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--font-book); font-weight: 700; font-size: 15px; color: var(--muted); letter-spacing: .02em; }
.brand b { color: var(--fg); }
.mode { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode button { border: 0; background: transparent; color: var(--muted); font: 15px var(--font-ui); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--sea); color: var(--card); }

.stage { margin: 0; border-radius: 14px; overflow: hidden; background: #1b2b36; aspect-ratio: 8 / 5; max-width: 100%; }
.stage svg { display: block; width: 100%; height: 100%; }

.story { display: grid; gap: 10px; min-width: 0; }
.chapter { font: 13px var(--font-ui); color: var(--ochre); letter-spacing: .08em; }
.story h1, .story h2 { margin: 0; font-family: var(--font-kid); font-weight: 400; text-wrap: balance; }
.story h1 { font-size: clamp(34px, 7vw, 52px); }
.story h2 { font-size: clamp(24px, 4.6vw, 32px); }
.kid { font-family: var(--font-kid); font-size: clamp(20px, 3.6vw, 25px); line-height: 1.6; margin: 0; max-width: 34em; }
.adult { font-family: var(--font-book); font-size: 18px; line-height: 1.85; margin: 0; max-width: 36em; }
.note { font-size: 14px; color: var(--muted); border-left: 3px solid var(--ochre); padding-left: 10px; margin: 0; max-width: 40em; line-height: 1.6; }
body[data-mode="kid"] .adult, body[data-mode="adult"] .kid { display: none; }

nav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
nav button.turn { border: 0; background: var(--sea); color: var(--card); font: 17px var(--font-kid); padding: 12px 18px; border-radius: 12px; cursor: pointer; min-width: 88px; }
nav button.turn:disabled { opacity: .3; cursor: default; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; padding: 0; background: var(--line); cursor: pointer; }
.dots button[aria-current="true"] { background: var(--ochre); transform: scale(1.3); }
.count { text-align: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 4px; }
button:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

/* 마지막 장 */
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.who { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; min-width: 0; }
.who svg { width: 64px; height: 64px; }
.who b { font-family: var(--font-kid); font-weight: 400; font-size: 19px; display: block; }
.who span { font-size: 14px; color: var(--muted); line-height: 1.5; }
.qs { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; font-size: 17px; line-height: 1.6; max-width: 36em; }
.qs.kidq { font-family: var(--font-kid); font-size: 20px; }
body[data-mode="kid"] .adultq, body[data-mode="adult"] .kidq { display: none; }

/* 완독 플랜 */
.paces { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pace { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; cursor: pointer; color: var(--fg); font: inherit; min-width: 0; }
.pace b { font-family: var(--font-kid); font-weight: 400; font-size: 21px; }
.pace span { font-size: 14px; color: var(--muted); line-height: 1.5; }
.pace .per { color: var(--sea); font-size: 15px; font-variant-numeric: tabular-nums; }
.pace[aria-pressed="true"] { border: 2px solid var(--sea); padding: 13px; }
.fields { display: flex; flex-wrap: wrap; gap: 12px; }
.fields label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.fields input { font: 16px var(--font-ui); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); width: 150px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 16px var(--font-ui); padding: 10px 16px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--sea); border-color: var(--sea); color: var(--card); }
.today-goal { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; }
.today-goal .big { font-family: var(--font-kid); font-size: clamp(24px, 5vw, 32px); }
.today-goal .big em { font-style: normal; color: var(--ochre); }
.progress { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--sea); }
.sched-wrap { overflow-x: auto; }
.sched { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
.sched th { text-align: left; font-weight: 400; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.sched td { padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sched tr.is-today td { background: color-mix(in srgb, var(--ochre) 14%, var(--card)); }
.sched tr.is-done td { color: var(--muted); }
.sched tr.is-done td.goal { text-decoration: line-through; }
.sched tr.is-late td.when { color: var(--ochre); }
.sched input { width: 20px; height: 20px; accent-color: var(--sea); }
.small { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 44em; }

/* 축하 */
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 140%); opacity: 0;
  display: flex; align-items: center; gap: 12px; max-width: min(92vw, 420px); padding: 14px 18px; border-radius: 16px;
  background: var(--fg); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s; z-index: 50; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#toast .t-emoji { font-size: 30px; line-height: 1; }
#toast b { display: block; font: 400 20px var(--font-kid); }
#toast small { display: block; font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }
#party { position: fixed; inset: 0; background: rgba(10,20,28,.55); display: grid; place-items: center; z-index: 60;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.party-card { background: var(--card); color: var(--fg); border-radius: 20px; padding: 28px 24px; max-width: 380px; text-align: center; display: grid; gap: 10px; justify-items: center; animation: pop .5s cubic-bezier(.2,1.5,.4,1); }
.party-card h2 { margin: 0; font: 400 44px var(--font-kid); color: var(--ochre); }
.party-card p { margin: 0; font-size: 16px; line-height: 1.6; }
.party-emoji { font-size: 56px; line-height: 1; }
#party[hidden] { display: none; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: opacity .2s; } .party-card { animation: none; } }
h3 { margin: 10px 0 0; font-family: var(--font-kid); font-weight: 400; font-size: 22px; }
.next-read { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 16px; line-height: 1.7; max-width: 40em; }

/* 움직임 */
.wave { animation: wave 6s linear infinite; }
@keyframes wave { to { transform: translateX(-50px); } }
.bounce { animation: bounce 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
.bounce.late { animation-delay: .45s; }
@keyframes bounce { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-14px) rotate(3deg); } }
.float { animation: floaty 3s ease-in-out infinite; }
.float.b { animation-delay: 1s; } .float.c { animation-delay: 2s; }
@keyframes floaty { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
.rain { animation: rain .7s linear infinite; }
@keyframes rain { to { transform: translate(-10px, 40px); } }
.shake { animation: shake .25s linear infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes shake { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
@media (prefers-reduced-motion: reduce) { .wave, .bounce, .float, .rain, .shake { animation: none; } .float { opacity: 1; } }
</style>

<div class="wrap">
  <header>
    <div class="mode" id="lib" role="group" aria-label="책 고르기">
      <button data-lib="zorba" aria-pressed="true">그리스인 조르바</button>
      <button data-lib="karamazov" aria-pressed="false">카라마조프가의 형제들</button>
    </div>
    <div class="mode" role="group" aria-label="읽기 모드">
      <button id="m-kid" aria-pressed="true">어린이</button>
      <button id="m-adult" aria-pressed="false">어른</button>
    </div>
  </header>

  <figure class="stage" id="stage" aria-live="polite"></figure>
  <section class="story" id="story"></section>

  <div>
    <nav>
      <button class="turn" id="prev">← 앞장</button>
      <div class="dots" id="dots"></div>
      <button class="turn" id="next">다음장 →</button>
    </nav>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
// ───────── 그림 재료 ─────────
let uid = 0;
const P = pts => 'M' + pts.map(p => p.join(' ')).join(' L');
function limbs(list, color, w) {
  return list.map(pts => `<path d="${P(pts)}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
}
const end = pts => pts[pts.length - 1];

// 조르바: 발끝이 (0,0). 큰 키, 회색 콧수염, 조끼와 붉은 허리띠
function Z(x, y, s = 1, pose = 'stand', cls = '') {
  const sh = [[-24, -116], [24, -116]], hp = [[-11, -60], [11, -60]];
  const poses = {
    stand: { la: [[-34, -62]], ra: [[34, -62]], ll: [[-13, 0]], rl: [[13, 0]] },
    wave:  { la: [[-34, -62]], ra: [[54, -146], [58, -180]], ll: [[-13, 0]], rl: [[13, 0]] },
    dance: { la: [[-62, -146], [-72, -178]], ra: [[62, -146], [72, -178]], ll: [[-18, 0]], rl: [[40, -28], [62, -34]] },
    play:  { la: [[-34, -86], [-12, -82]], ra: [[34, -86], [12, -82]], ll: [[-13, 0]], rl: [[13, 0]] },
    work:  { la: [[-34, -150], [-22, -180]], ra: [[6, -150], [-14, -176]], ll: [[-16, 0]], rl: [[16, 0]] },
    hold:  { la: [[-34, -62]], ra: [[46, -92], [66, -84]], ll: [[-13, 0]], rl: [[13, 0]] },
  };
  const p = poses[pose];
  const la = [sh[0], ...p.la], ra = [sh[1], ...p.ra], ll = [hp[0], ...p.ll], rl = [hp[1], ...p.rl];
  const pick = pose === 'work' ? `<path d="M-20 -176 L-2 -244" stroke="#7a5230" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M-36 -236 Q-4 -258 30 -236" stroke="#8a8f94" stroke-width="7" fill="none" stroke-linecap="round"/>` : '';
  return `<g class="${cls}"><g transform="translate(${x} ${y}) scale(${s})">
    ${limbs([ll, rl], '#3b3f46', 15)}
    ${[ll, rl].map(l => `<ellipse cx="${end(l)[0] + 4}" cy="${end(l)[1] + 1}" rx="11" ry="6" fill="#22201d"/>`).join('')}
    <rect x="-28" y="-130" width="56" height="74" rx="16" fill="#efe6d2"/>
    <path d="M-28 -112 Q-28 -130 -12 -130 L-6 -58 L-28 -58 Z" fill="#4b3222"/>
    <path d="M28 -112 Q28 -130 12 -130 L6 -58 L28 -58 Z" fill="#4b3222"/>
    <rect x="-28" y="-68" width="56" height="10" fill="#b23a2a"/>
    ${pick}
    ${limbs([la, ra], '#efe6d2', 13)}
    ${[la, ra].map(a => `<circle cx="${end(a)[0]}" cy="${end(a)[1]}" r="7" fill="#c98a5b"/>`).join('')}
    <rect x="-7" y="-136" width="14" height="10" fill="#c98a5b"/>
    <circle cx="0" cy="-152" r="22" fill="#c98a5b"/>
    <path d="M-24 -156 Q-22 -182 0 -182 Q22 -182 24 -156 Z" fill="#26231f"/>
    <path d="M-13 -160 L-4 -158 M13 -160 L4 -158" stroke="#3a3530" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-8" cy="-153" r="2.4" fill="#1b1b1b"/><circle cx="8" cy="-153" r="2.4" fill="#1b1b1b"/>
    <path d="M-17 -141 Q-9 -149 0 -143 Q9 -149 17 -141 Q9 -137 0 -139 Q-9 -137 -17 -141 Z" fill="#6c6660"/>
    <path d="M-6 -134 Q0 -130 6 -134" stroke="#7a3b2a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g></g>`;
}

// 나(화자): 마른 체형, 안경, 책
function B(x, y, s = 1, pose = 'stand', cls = '') {
  const sh = [[-18, -112], [18, -112]], hp = [[-9, -58], [9, -58]];
  const poses = {
    stand: { la: [[-26, -60]], ra: [[26, -60]], ll: [[-10, 0]], rl: [[10, 0]] },
    read:  { la: [[-24, -90], [-8, -92]], ra: [[24, -90], [8, -92]], ll: [[-10, 0]], rl: [[10, 0]] },
    dance: { la: [[-50, -138], [-58, -168]], ra: [[50, -138], [58, -168]], ll: [[-14, 0]], rl: [[30, -26], [48, -30]] },
    wave:  { la: [[-26, -60]], ra: [[42, -138], [46, -168]], ll: [[-10, 0]], rl: [[10, 0]] },
  };
  const p = poses[pose];
  const la = [sh[0], ...p.la], ra = [sh[1], ...p.ra], ll = [hp[0], ...p.ll], rl = [hp[1], ...p.rl];
  const book = pose === 'read' ? `<rect x="-17" y="-106" width="34" height="24" rx="2" fill="#a8372a"/><path d="M0 -106 L0 -82" stroke="#f3ead8" stroke-width="2"/>` : '';
  return `<g class="${cls}"><g transform="translate(${x} ${y}) scale(${s})">
    ${limbs([ll, rl], '#2f3a48', 12)}
    ${[ll, rl].map(l => `<ellipse cx="${end(l)[0] + 3}" cy="${end(l)[1] + 1}" rx="9" ry="5" fill="#1c1c1c"/>`).join('')}
    <rect x="-21" y="-126" width="42" height="70" rx="12" fill="#7d9cb3"/>
    ${limbs([la, ra], '#7d9cb3', 10)}
    ${book}
    ${[la, ra].map(a => `<circle cx="${end(a)[0]}" cy="${end(a)[1]}" r="5.5" fill="#e5bb92"/>`).join('')}
    <rect x="-6" y="-132" width="12" height="9" fill="#e5bb92"/>
    <circle cx="0" cy="-146" r="19" fill="#e5bb92"/>
    <path d="M-20 -148 Q-20 -170 0 -169 Q20 -170 20 -150 Q10 -160 -4 -157 Q-14 -156 -20 -148 Z" fill="#1d1d22"/>
    <circle cx="-7" cy="-146" r="6" fill="none" stroke="#222" stroke-width="2"/><circle cx="7" cy="-146" r="6" fill="none" stroke="#222" stroke-width="2"/>
    <path d="M-1 -146 L1 -146" stroke="#222" stroke-width="2"/>
    <circle cx="-7" cy="-146" r="1.8" fill="#222"/><circle cx="7" cy="-146" r="1.8" fill="#222"/>
    <path d="M-5 -134 Q0 -131 5 -134" stroke="#8a4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g></g>`;
}

// 오르탕스 부인 / 과부
function W(x, y, s = 1, kind = 'hortense', cls = '') {
  const h = kind === 'hortense';
  const dress = h ? '#e48aa8' : '#202026', skin = h ? '#efc6a4' : '#ead2b8';
  const hair = h
    ? [[-18, -150], [18, -150], [-14, -164], [14, -164], [0, -170], [-22, -136], [22, -136]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="11" fill="#f0c64a"/>`).join('')
    : `<path d="M-24 -126 Q-26 -172 0 -172 Q26 -172 24 -126 Q12 -118 0 -120 Q-12 -118 -24 -126 Z" fill="#141418"/>`;
  const face = h
    ? `<circle cx="-7" cy="-146" r="2.4" fill="#222"/><circle cx="7" cy="-146" r="2.4" fill="#222"/><circle cx="-12" cy="-139" r="4" fill="#f29bb0"/><circle cx="12" cy="-139" r="4" fill="#f29bb0"/><ellipse cx="0" cy="-134" rx="4" ry="2.6" fill="#c8283c"/>`
    : `<path d="M-10 -145 L-4 -144 M10 -145 L4 -144" stroke="#333" stroke-width="2" stroke-linecap="round"/><path d="M-4 -133 Q0 -135 4 -133" stroke="#7a4a3a" stroke-width="2" fill="none"/>`;
  const fan = h ? `<path d="M30 -96 L58 -122 A34 34 0 0 1 64 -84 Z" fill="#f7dbe4" stroke="#c76b8a" stroke-width="2"/>` : '';
  return `<g class="${cls}"><g transform="translate(${x} ${y}) scale(${s})">
    <path d="M-20 -122 L20 -122 L46 0 L-46 0 Z" fill="${dress}"/>
    ${h ? '<path d="M-42 -14 Q-30 -4 -18 -14 Q-6 -4 6 -14 Q18 -4 30 -14 Q38 -6 44 -12" stroke="#fff3f6" stroke-width="3" fill="none"/>' : ''}
    <path d="M-18 -116 L-34 -70 M18 -116 L32 -96" stroke="${dress}" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-34" cy="-70" r="5.5" fill="${skin}"/><circle cx="32" cy="-96" r="5.5" fill="${skin}"/>
    ${fan}
    ${h ? '' : hair}
    <circle cx="0" cy="-144" r="18" fill="${skin}"/>
    ${h ? hair : ''}
    ${h ? `<circle cx="0" cy="-144" r="15" fill="${skin}"/>` : ''}
    ${face}
  </g></g>`;
}

// 마을 사람(실루엣)
function V(x, y, s = 1, c = '#5f666b') {
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-22 0 L-18 -86 Q0 -98 18 -86 L22 0 Z" fill="${c}"/><circle cx="0" cy="-108" r="16" fill="${c}"/><path d="M-6 -102 Q0 -106 6 -102" stroke="#2b2f33" stroke-width="2" fill="none"/><path d="M-8 -112 L-3 -110 M8 -112 L3 -110" stroke="#2b2f33" stroke-width="2"/></g>`;
}

const sky = (a, b) => { const id = 'g' + (++uid); return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="500" fill="url(#${id})"/>`; };
function waves(y, c, o = .55) { let d = `M-100 ${y}`; for (let i = 0; i < 22; i++) d += ' q12.5 -7 25 0 t25 0'; return `<path class="wave" d="${d}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" opacity="${o}"/>`; }
const sea = (y, c, w) => `<rect y="${y}" width="800" height="${500 - y}" fill="${c}"/>${waves(y + 18, w)}${waves(y + 46, w, .35)}`;
const sand = (y, c = '#e3c07e') => `<path d="M0 ${y} Q200 ${y - 22} 400 ${y - 6} T800 ${y - 10} V500 H0 Z" fill="${c}"/>`;
const olive = (x, y, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-4 0 Q-8 -30 2 -56 L8 -56 Q2 -30 6 0 Z" fill="#6a4b2d"/><circle cx="-18" cy="-66" r="22" fill="#6e7f3c"/><circle cx="16" cy="-70" r="24" fill="#7a8c45"/><circle cx="0" cy="-88" r="22" fill="#66773a"/></g>`;

// ───────── 완독 플랜 ─────────
// 권이 여러 개인 책은 전체를 이어진 쪽수(1권 1쪽 = 1)로 계산하고, 화면에는 "2권 120쪽"처럼 보여 줌
const BOOKS = {
  zorba: { title: '그리스인 조르바', pub: '열린책들 세계문학 21 · 이윤기 옮김', vols: [482], doc: 'reading-plan', ls: 'zorba-plan',

};
const PACES = {

};
const MIN_PER_PAGE = 1.3; // 소설 한 쪽을 읽는 데 드는 대략적인 시간(분)
const DOWK = ['일', '월', '화', '수', '목', '금', '토'];
const p2 = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAYK = keyOf(new Date());
const sum = a => a.reduce((x, y) => x + y, 0);

const planStore = {
  db: null, uid: null,
  async get(b) {
    if (this.db) { const s = await this.db.collection('data/users/' + this.uid).doc(BOOKS[b].doc).get(); return s.exists ? s.data() : null; }
    try { return JSON.parse(localStorage.getItem(BOOKS[b].ls)); } catch { return null; }
  },
  async set(b, v) {
    if (this.db) return this.db.collection('data/users/' + this.uid).doc(BOOKS[b].doc).set(v);
    try { localStorage.setItem(BOOKS[b].ls, JSON.stringify(v)); } catch {}
  },
  async clear(b) {
    if (this.db) return this.db.collection('data/users/' + this.uid).doc(BOOKS[b].doc).delete();
    try { localStorage.removeItem(BOOKS[b].ls); } catch {}
  },
};
let cur = 'zorba';
try { if (BOOKS[localStorage.getItem('plan-book')]) cur = localStorage.getItem('plan-book'); } catch {}
const plans = {}, drafts = {};
let planLoaded = false, planNote = '';
for (const b in BOOKS) drafts[b] = { days: 14, start: TODAYK, vols: [...BOOKS[b].vols], fromVol: 1, fromPage: 0 };

// 이어진 쪽수 ↔ 권·쪽
function volsOf(p) { return p.vols || [p.total]; }
function loc(vols, g) { let v = 0; while (v < vols.length - 1 && g > vols[v]) { g -= vols[v]; v++; } return { v: v + 1, p: g }; }
function at(vols, g) { const l = loc(vols, g); return vols.length > 1 ? `${l.v}권 ${l.p}쪽` : `${l.p}쪽`; }
function range(vols, a, b) {
  const x = loc(vols, a), y = loc(vols, b);
  if (vols.length === 1) return `p.${x.p}–${y.p}`;
  return x.v === y.v ? `${x.v}권 p.${x.p}–${y.p}` : `${x.v}권 p.${x.p} → ${y.v}권 p.${y.p}`;
}

// 쪽수를 날짜별로 고르게 나눔 (누적 목표를 반올림해 마지막 날 정확히 끝나게)
function segments(fromPage, total, startKey, days) {
  const n = total - fromPage + 1, out = [];
  let prev = fromPage - 1;
  for (let i = 0; i < days; i++) {
    const to = fromPage - 1 + Math.round(n * (i + 1) / days);
    out.push({ date: keyOf(addDays(parseKey(startKey), i)), from: prev + 1, to, done: false });
    prev = to;
  }
  return out.filter(s => s.to >= s.from);
}
function readTo(p) { return p.segs.filter(s => s.done).reduce((m, s) => Math.max(m, s.to), p.from - 1); }
function draftFrom(d) { return sum(d.vols.slice(0, d.fromVol - 1)) + d.fromPage + 1; }

function bookTabs() {
  return `<div class="mode" role="group" aria-label="책 고르기" style="justify-self:start;flex-wrap:wrap">${Object.entries(BOOKS).map(([k, b]) =>
    `<button class="booktab" data-book="${k}" aria-pressed="${k === cur}">${b.title}</button>`).join('')}</div>`;
}

function planHTML() {
  const B = BOOKS[cur];
  if (!planLoaded) return `<div class="chapter">완독 플랜</div>${bookTabs()}<h2>불러오는 중…</h2>`;
  const plan = plans[cur];
  if (!plan) {
    const d = drafts[cur], total = sum(d.vols), left = total - draftFrom(d) + 1;
    const per = n => Math.ceil(left / n);
    const multi = d.vols.length > 1;
    return `<div class="chapter">완독 플랜</div>${bookTabs()}<h2>${B.title}, 끝까지 읽어 볼까요?</h2>
      <p class="adult" style="display:block">${B.pub} 기준 ${multi ? d.vols.map((v, i) => `${i + 1}권 ${v}쪽`).join(', ') + `, 모두 ${total}쪽` : `전체 ${total}쪽`}입니다.${left < total ? ` 이미 읽은 곳을 빼면 ${left}쪽 남았어요.` : ''} 기간을 고르면 날짜마다 "오늘은 어디까지"를 정해 드려요.</p>
      <div class="paces">${Object.entries(PACES).map(([n, p]) => `<button class="pace" data-days="${n}" aria-pressed="${+n === d.days}"><b>${p.name}</b><span class="per">하루 약 ${per(+n)}쪽 · 대략 ${Math.round(per(+n) * MIN_PER_PAGE)}분</span><span>${p.tip}</span></button>`).join('')}</div>
      <div class="fields">
        <label>시작일<input type="date" id="pl-start" value="${d.start}"></label>
        ${d.vols.map((v, i) => `<label>${multi ? `${i + 1}권 쪽수` : '전체 쪽수'}<input type="number" class="pl-vol" data-v="${i}" min="10" max="3000" value="${v}"></label>`).join('')}
      </div>
      <div class="fields">
        ${multi ? `<label>지금 읽고 있는 권<select id="pl-fromvol" style="font:16px var(--font-ui);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:150px">${d.vols.map((_, i) => `<option value="${i + 1}" ${d.fromVol === i + 1 ? 'selected' : ''}>${i + 1}권</option>`).join('')}</select></label>` : ''}
        <label>${multi ? '그 권에서 읽은 쪽' : '이미 읽은 쪽'}<input type="number" id="pl-from" min="0" max="3000" value="${d.fromPage}"></label>
      </div>
      <div class="actions"><button class="btn primary" id="pl-make">이 일정으로 시작하기</button></div>
      <p class="small">${B.note} 읽는 시간은 한 쪽에 1분 20초 정도로 잡은 어림값이에요.</p>`;
  }
  const vols = volsOf(plan), total = plan.total, done = readTo(plan);
  const pct = Math.round((done - plan.from + 1) / (total - plan.from + 1) * 100);
  const todaySeg = plan.segs.find(s => s.date === TODAYK);
  const late = plan.segs.filter(s => s.date < TODAYK && !s.done);
  const last = plan.segs[plan.segs.length - 1];
  const pos = done >= plan.from ? at(vols, done) : (plan.from > 1 ? at(vols, plan.from - 1) : '시작 전');
  let headline;
  if (done >= total) headline = `<span class="big">완독했어요!</span><span>${B.finish}</span>`;
  else if (todaySeg && !todaySeg.done) headline = `<span class="big">오늘은 <em>${at(vols, todaySeg.to)}</em>까지</span><span>${range(vols, todaySeg.from, todaySeg.to)}, ${todaySeg.to - todaySeg.from + 1}쪽. 대략 ${Math.round((todaySeg.to - todaySeg.from + 1) * MIN_PER_PAGE)}분이면 돼요.${loc(vols, todaySeg.from).v !== loc(vols, todaySeg.to).v ? ' 오늘 다음 권으로 넘어가요.' : ''}</span>`;
  else if (todaySeg && todaySeg.done) headline = `<span class="big">오늘 분량 끝!</span><span>${at(vols, done)}까지 읽었어요. ${done > todaySeg.to ? '목표보다 앞서 가고 있어요.' : '내일 다시 만나요.'}</span>`;
  else if (TODAYK < plan.segs[0].date) headline = `<span class="big"><em>${plan.segs[0].date.slice(5).replace('-', '/')}</em>에 시작해요</span><span>첫날은 ${at(vols, plan.segs[0].to)}까지예요.</span>`;
  else headline = `<span class="big">계획한 날이 지났어요</span><span>남은 ${total - done}쪽을 다시 나눠 볼까요?</span>`;
  return `<div class="chapter">완독 플랜 · ${PACES[plan.days]?.name || plan.days + '일'}</div>${bookTabs()}<h2>${B.title} 완독까지</h2>
    <div class="today-goal">${headline}
      <div class="progress" aria-label="진행률 ${pct}%"><span style="width:${pct}%"></span></div>
      <span class="small">지금 ${pos} · 전체 ${total}쪽 중 ${pct}% · 마지막 날 ${last.date.slice(5).replace('-', '/')}</span>
    </div>
    ${planNote ? `<p class="note">${planNote}</p>` : ''}
    ${late.length && done < total ? `<p class="note">지난 날짜 중 ${late.length}일 분량이 체크되지 않았어요. 읽었다면 체크하고, 밀렸다면 남은 분량을 오늘부터 다시 나눌 수 있어요.</p><div class="actions"><button class="btn primary" id="pl-rebase">오늘부터 다시 나누기</button></div>` : ''}
    <div class="sched-wrap"><table class="sched">
      <thead><tr><th>날짜</th><th>읽을 곳</th><th>목표</th><th>다 읽음</th></tr></thead>
      <tbody>${plan.segs.map((s, i) => { const d = parseKey(s.date); const cls = [s.date === TODAYK ? 'is-today' : '', s.done ? 'is-done' : '', !s.done && s.date < TODAYK ? 'is-late' : ''].join(' ');
        return `<tr class="${cls}"><td class="when">${d.getMonth() + 1}/${d.getDate()} (${DOWK[d.getDay()]})${s.date === TODAYK ? ' · 오늘' : ''}</td><td>${range(vols, s.from, s.to)}</td><td class="goal">${at(vols, s.to)}까지</td><td><input type="checkbox" data-i="${i}" ${s.done ? 'checked' : ''} aria-label="${d.getMonth() + 1}월 ${d.getDate()}일 분량 다 읽음"></td></tr>`; }).join('')}</tbody>
    </table></div>
    <div class="actions"><button class="btn" id="pl-reset">플랜 새로 짜기</button></div>
    <p class="small">${planStore.db ? '진행 상황은 내 계정에 나만 볼 수 있게 저장돼요.' : '진행 상황은 이 브라우저에 저장돼요.'}</p>`;
}

function bindPlan() {
  const q = s => story.querySelector(s);
  story.querySelectorAll('.booktab').forEach(b => b.onclick = () => {
    readDraft(); cur = b.dataset.book; planNote = '';
    try { localStorage.setItem('plan-book', cur); } catch {}
    renderPlan();
  });
  story.querySelectorAll('.pace').forEach(b => b.onclick = () => { readDraft(); drafts[cur].days = +b.dataset.days; renderPlan(); });
  story.querySelectorAll('.pl-vol, #pl-from, #pl-fromvol').forEach(el => el.onchange = () => { readDraft(); renderPlan(); });
  if (q('#pl-make')) q('#pl-make').onclick = async () => {
    readDraft();
    const d = drafts[cur], total = sum(d.vols), from = Math.min(total, draftFrom(d));
    plans[cur] = { book: cur, days: d.days, start: d.start, vols: [...d.vols], total, from, segs: segments(from, total, d.start, d.days), created: Date.now() };
    planNote = '';
    await savePlan();
  };
  story.querySelectorAll('.sched input').forEach(c => c.onchange = async () => {
    const i = +c.dataset.i, plan = plans[cur];
    // 체크하면 그날까지 이전 날짜도 함께 체크, 해제하면 그 뒤도 함께 해제
    const before = readTo(plan);
    plan.segs.forEach((s, j) => { if (c.checked && j <= i) s.done = true; if (!c.checked && j >= i) s.done = false; });
    planNote = '';
    const after = readTo(plan);
    if (after > before) cheer(plan, before, after);
    await savePlan();
  });
  if (q('#pl-rebase')) q('#pl-rebase').onclick = async () => {
    const plan = plans[cur], done = readTo(plan);
    const kept = plan.segs.filter(s => s.done);
    const left = Math.max(1, plan.segs.filter(s => s.date >= TODAYK).length || 3);
    plan.segs = [...kept, ...segments(done + 1, plan.total, TODAYK, left)];
    planNote = `남은 ${plan.total - done}쪽을 ${left}일로 다시 나눴어요. 하루 약 ${Math.ceil((plan.total - done) / left)}쪽이에요.`;
    await savePlan();
  };
  if (q('#pl-reset')) q('#pl-reset').onclick = async () => {
    if (q('#pl-reset').dataset.armed) { plans[cur] = null; planNote = ''; await planStore.clear(cur).catch(() => {}); renderPlan(); }
    else { q('#pl-reset').dataset.armed = '1'; q('#pl-reset').textContent = '지금 기록이 지워져요. 한 번 더 누르면 새로 짭니다'; }
  };
}

const pickOne = a => a[Math.floor(Math.random() * a.length)];
function cheer(plan, before, after) {
  const vols = volsOf(plan), total = plan.total, span = total - plan.from + 1;
  const pctB = (before - plan.from + 1) / span, pctA = (after - plan.from + 1) / span;
  const left = total - after, read = after - before;
  if (after >= total) return finishParty(plan);
  // 권이 끝난 순간 (여러 권짜리)
  const volB = loc(vols, Math.max(1, before)).v, volEnd = vols.slice(0, volB).reduce((a, b) => a + b, 0);
  let title, emoji;
  if (vols.length > 1 && before < volEnd && after >= volEnd) { title = `${volB}권 끝! 이제 ${volB + 1}권으로`; emoji = '📕'; }
  else if (pctB < .5 && pctA >= .5) { title = '반환점 통과!'; emoji = '🏁'; }
  else if (pctA < .35) { title = pickOne(['오늘도 고생했어요', '좋은 출발이에요', '한 걸음씩, 잘하고 있어요']); emoji = '🌱'; }
  else if (pctA < .65) { title = pickOne(['꾸준함이 보여요', '벌써 이만큼 왔어요', '오늘도 해냈어요']); emoji = '📖'; }
  else if (pctA < .9) { title = pickOne(['얼마 안 남았어요', '조금만 더 힘!', '끝이 보이기 시작해요']); emoji = '💪'; }
  else { title = pickOne(['결승선이 바로 앞이에요!', '마지막 스퍼트!']); emoji = '🔥'; }
  toast(emoji, title, `오늘 ${read}쪽 읽었어요 · 남은 ${left}쪽 · ${Math.round(pctA * 100)}%`);
}
let toastTimer;
function toast(emoji, title, sub) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
  t.innerHTML = `<span class="t-emoji" aria-hidden="true">${emoji}</span><span><b>${title}</b><small>${sub}</small></span>`;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
}
function finishParty(plan) {
  const B = BOOKS[plan.book || cur];
  const days = plan.segs.filter(s => s.done).length;
  let o = document.getElementById('party');
  if (!o) { o = document.createElement('div'); o.id = 'party'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', '완독 축하'); document.body.appendChild(o); }
  o.innerHTML = `<div class="party-card"><div class="party-emoji" aria-hidden="true">🎉</div><h2>완독!</h2>
    <p>${B.title} ${plan.total - plan.from + 1}쪽을 ${days}일 만에 다 읽었어요.</p><p class="small">${B.finish}</p>
    <button class="btn primary" id="party-close">닫기</button></div>`;
  o.hidden = false;
  o.querySelector('#party-close').onclick = () => { o.hidden = true; };
  o.onclick = e => { if (e.target === o) o.hidden = true; };
  o.querySelector('#party-close').focus();
  confetti();
}
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const ctx = c.getContext('2d'), W = c.width = innerWidth, H = c.height = innerHeight;
  const colors = ['#1f5f8b', '#b8772f', '#e48aa8', '#6e7f3c', '#f0c64a', '#c8343c'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + (Math.random() - .5) * 80, y: H * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, c: pickOne(colors), s: Math.random() * .3 - .15 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of ps) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function readDraft() {
  const q = s => story.querySelector(s), d = drafts[cur];
  if (!q('#pl-start')) return;
  d.start = q('#pl-start').value || TODAYK;
  story.querySelectorAll('.pl-vol').forEach(el => { d.vols[+el.dataset.v] = Math.max(10, Math.min(3000, parseInt(el.value) || BOOKS[cur].vols[+el.dataset.v])); });
  d.fromVol = q('#pl-fromvol') ? +q('#pl-fromvol').value : 1;
  d.fromPage = Math.max(0, Math.min(d.vols[d.fromVol - 1], parseInt(q('#pl-from').value) || 0));
}
async function savePlan() {
  renderPlan();
  try { await planStore.set(cur, plans[cur]); } catch { planNote = '저장하지 못했어요. 잠시 뒤 다시 체크해 주세요.'; renderPlan(); }
}
function renderPlan() { if (PAGES[i]?.plan) { story.innerHTML = planHTML(); bindPlan(); } }
async function loadPlan() {
  if (window.claude?.use) {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id().catch(() => null) : null;
    if (db && uid) { planStore.db = db; planStore.uid = uid; }
  }
  for (const b in BOOKS) { try { plans[b] = await planStore.get(b); } catch { plans[b] = null; } }
  planLoaded = true;
  renderPlan();
}

    <div class="who"><svg viewBox="-60 -200 120 120" aria-hidden="true">${k('ivan', 0, 0, 1)}</svg><div><b>이반</b><span>"신이 없다면?"을 묻는 냉철한 둘째</span></div></div>
    <div class="who"><svg viewBox="-60 -200 120 120" aria-hidden="true">${k('alyosha', 0, 0, 1, { mood: 'smile' })}</svg><div><b>알료샤</b><span>모두를 품는 막내. 이 소설의 주인공</span></div></div>
    <div class="who"><svg viewBox="-60 -200 120 120" aria-hidden="true">${k('fyodor', 0, 0, 1, { mood: 'sly' })}</svg><div><b>표도르</b><span>탐욕스러운 아버지</span></div></div>
    <div class="who"><svg viewBox="-60 -200 120 120" aria-hidden="true">${k('smerd', 0, 0, 1, { mood: 'sly' })}</svg><div><b>스메르댜코프</b><span>말없는 하인. 숨은 사생아라는 소문</span></div></div>
    <div class="who"><svg viewBox="-60 -200 120 120" aria-hidden="true">${k('grush', 0, 0, 1)}</svg><div><b>그루셴카</b><span>아버지와 아들이 함께 사랑한 여인</span></div></div>
  </div>
  <h3>함께 이야기해 봐요</h3>
  <ol class="qs kidq">
    <li>세 형제 중 누구와 가장 친구가 되고 싶나요? 왜요?</li>
    <li>직접 하지 않았는데도 나쁜 일에 책임이 있을 수 있을까요?</li>
    <li>알료샤와 소년들처럼 꼭 기억하고 싶은 날이 있나요?</li>
  </ol>
  <ol class="qs adultq">
    <li>표도르를 실제로 죽인 사람과, 그 죽음에 책임 있는 사람은 같은가.</li>
    <li>대심문관의 말처럼 사람들은 자유보다 빵과 안정을 원할까.</li>
    <li>드미트리는 짓지 않은 죄의 벌을 왜 받아들였을까.</li>
  </ol>
  <h3>원작은 이렇게 읽어 보세요</h3>
  <div class="next-read">
    처음 몇 편은 인물 소개와 가족사가 길어 지치기 쉽습니다. 위의 인물 카드를 옆에 두고, 이름이 애칭으로 바뀌어도(알렉세이 = 알료샤, 드미트리 = 미챠) 같은 사람이라는 것만 기억하면 훨씬 수월합니다.
    철학적인 핵심이 궁금하면 제5편 「프로와 콘트라」의 「반역」과 「대심문관」 장을 먼저 읽어 봐도 좋습니다.<br><br>
    도스토옙스키(1821–1881)는 이 작품을 끝내고 몇 달 뒤 세상을 떠났습니다. 서문에서 예고한 알료샤의 다음 이야기는 끝내 쓰이지 못했습니다.
  </div>
  <div class="actions"><button class="btn primary" id="to-plan">완독 플랜 짜기 →</button></div>`;

// ───────── 넘기기 ─────────
const stage = document.getElementById('stage'), story = document.getElementById('story');
const dots = document.getElementById('dots'), count = document.getElementById('count');
const prevB = document.getElementById('prev'), nextB = document.getElementById('next');
const LIB = {
  zorba:     { title: '그리스인 조르바', author: '니코스 카잔차키스', pages: PAGES_Z, ending: ENDING_Z, h: 'p' },
  karamazov: { title: '카라마조프가의 형제들', author: '표도르 도스토옙스키', pages: PAGES_K, ending: ENDING_K, h: 'k' },
};
let book = 'zorba', PAGES = PAGES_Z;
let i = 0;

function buildDots() {
  dots.innerHTML = '';
  PAGES.forEach((_, n) => { const b = document.createElement('button'); b.setAttribute('aria-label', `${n + 1}쪽으로`); b.onclick = () => go(n); dots.appendChild(b); });
}
function setBook(b) {
  book = b; PAGES = LIB[b].pages;
  document.querySelectorAll('#lib button').forEach(x => x.setAttribute('aria-pressed', x.dataset.lib === b));
  buildDots();
}
document.querySelectorAll('#lib button').forEach(x => x.onclick = () => { if (x.dataset.lib !== book) { setBook(x.dataset.lib); go(0); } });

function render() {
  const p = PAGES[i];
  if (p.end) {
    stage.hidden = true;
    story.innerHTML = LIB[book].ending;
    story.querySelector('#to-plan').onclick = () => { cur = book; try { localStorage.setItem('plan-book', cur); } catch {} go(PAGES.length - 1); };
  } else if (p.plan) {
    cur = book;
    stage.hidden = true;
    story.innerHTML = planHTML();
    bindPlan();
  } else {
    stage.hidden = false;
    uid = 0;
    stage.innerHTML = scenes[p.scene]();
    stage.setAttribute('aria-label', p.title || '표지');
    story.innerHTML = p.cover
      ? `<div class="chapter">${LIB[book].author} 원작 · 그림책으로 다시 읽기</div><h1>${LIB[book].title}</h1><p class="kid">${p.kid}</p><p class="adult">${p.adult}</p>`
      : `<div class="chapter">${p.chapter}</div><h2>${p.title}</h2><p class="kid">${p.kid}</p><p class="adult">${p.adult}</p>${p.note ? `<p class="note">${p.note}</p>` : ''}`;
  }
  [...dots.children].forEach((d, n) => d.setAttribute('aria-current', n === i ? 'true' : 'false'));
  prevB.disabled = i === 0;
  nextB.disabled = i === PAGES.length - 1;
  nextB.textContent = i === 0 ? '펼치기 →' : '다음장 →';
  count.textContent = `${i + 1} / ${PAGES.length}`;
}
function go(n, push = true) {
  i = Math.max(0, Math.min(PAGES.length - 1, n));
  render();
  if (push) history.replaceState(null, '', i || book !== 'zorba' ? '#' + LIB[book].h + i : location.pathname);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
prevB.onclick = () => go(i - 1);
nextB.onclick = () => go(i + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
document.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 60) go(i + (dx < 0 ? 1 : -1)); tx = null; });
function fromHash() {
  const m = /^#([pk])(\d+)$/.exec(location.hash);
  const b = m && m[1] === 'k' ? 'karamazov' : 'zorba';
  if (b !== book || !dots.children.length) setBook(b);
  go(m ? +m[2] : 0, false);
}
window.addEventListener('hashchange', fromHash);

// 읽기 모드
function setMode(m) {
  document.body.dataset.mode = m;
  document.getElementById('m-kid').setAttribute('aria-pressed', m === 'kid');
  document.getElementById('m-adult').setAttribute('aria-pressed', m === 'adult');
  try { localStorage.setItem('zorba-mode', m); } catch {}
}
document.getElementById('m-kid').onclick = () => setMode('kid');
document.getElementById('m-adult').onclick = () => setMode('adult');
let saved = 'kid'; try { saved = localStorage.getItem('zorba-mode') || 'kid'; } catch {}
setMode(saved);
fromHash();
loadPlan();
</script>
